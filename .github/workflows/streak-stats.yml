name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak Stats
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: psamuelvijay
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: dark
          OUTPUT_PATH: github-streak.svg
          RING: "FF6B35"
          FIRE: "F7931E"
          BACKGROUND: "0d1117"
          STROKE: "FF6B35"
          CURR_STREAK_NUM: "ffffff"
          SIDE_NUMS: "ffffff"
          CURR_STREAK_LABEL: "FF6B35"
          DATES: "888888"
          ANIMATED: "true"
          HIDE_BORDER: "false"

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-streak.svg
          git diff --cached --quiet || git commit -m "Update streak stats [skip ci]"
          git push
