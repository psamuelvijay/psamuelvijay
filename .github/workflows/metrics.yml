name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: psamuelvijay
          template: classic
          base: header, repositories
          config_timezone: Asia/Kolkata
          config_output: svg
          filename: github-metrics.svg
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, makefile, dockerfile
